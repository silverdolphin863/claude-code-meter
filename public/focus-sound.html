<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
<title>CC Meter focus sounds</title>
</head>
<body>
<script>
  // Hidden window: plays the panel focus timer sounds. Same tones as
  // docs/lcd-preview-pomodoro.html. The main process calls playFocusSound().
  let ac = null;
  function tone(freq, dur, type = 'sine', gain = 0.15, when = 0) {
    ac = ac || new AudioContext();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sounds = {
    tap: () => tone(1800, 0.03, 'square', 0.05),
    start: () => { tone(523, 0.12); tone(784, 0.18, 'sine', 0.15, 0.1); },
    pause: () => { tone(784, 0.1); tone(523, 0.16, 'sine', 0.12, 0.08); },
    reset: () => tone(660, 0.09, 'triangle', 0.09),
    skip: () => { tone(990, 0.05, 'triangle', 0.08); tone(1320, 0.07, 'triangle', 0.08, 0.06); },
    tick: (n) => tone(n <= 3 ? 1320 : 990, 0.06, 'triangle', n <= 3 ? 0.2 : 0.1),
    done: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.5, 'sine', 0.16, i * 0.14)),
  };
  window.playFocusSound = (event) => {
    const play = sounds[event && event.event];
    if (!play) return false;
    if (ac && ac.state === 'suspended') ac.resume();
    play(event.second || 0);
    return true;
  };
</script>
</body>
</html>
