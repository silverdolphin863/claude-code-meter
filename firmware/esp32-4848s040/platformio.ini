[platformio]
default_envs = esp32-4848s040

[env:esp32-4848s040]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#3cc08c4e9ab6d85807e49b657d73fae10871616
    https://github.com/TAMCTec/gt911-arduino.git#b3f175e65a799368be9c544e255204e1e74ad2ed
    https://github.com/bblanchon/ArduinoJson.git#ed69feadb95182dc53ac978975d310122060a767

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:native]
platform = native
test_framework = unity
lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#ed69feadb95182dc53ac978975d310122060a767
build_flags =
    -std=c++17
build_src_filter =
    +<usage_model.cpp>
    +<usage_model_core.cpp>
