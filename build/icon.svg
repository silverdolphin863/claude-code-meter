<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272433"/>
      <stop offset="1" stop-color="#131219"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d17a"/><stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc61f"/><stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5f56"/>
    </linearGradient>
    <pattern id="tex" width="26" height="26" patternUnits="userSpaceOnUse"
             patternTransform="rotate(135)">
      <rect width="26" height="26" fill="#332f41"/>
      <rect width="10" height="26" fill="#3d3950"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="212" fill="none"
        stroke="#4a4560" stroke-width="8" stroke-opacity="0.65"/>

  <g filter="url(#soft)">
    <!-- Three stacked gauges, echoing the widget's own bars. -->
    <rect x="196" y="316" width="632" height="76" rx="38" fill="url(#tex)"/>
    <rect x="196" y="316" width="424" height="76" rx="38" fill="url(#g1)"/>

    <rect x="196" y="474" width="632" height="76" rx="38" fill="url(#tex)"/>
    <rect x="196" y="474" width="300" height="76" rx="38" fill="url(#g2)"/>

    <rect x="196" y="632" width="632" height="76" rx="38" fill="url(#tex)"/>
    <rect x="196" y="632" width="536" height="76" rx="38" fill="url(#g3)"/>
  </g>
</svg>
